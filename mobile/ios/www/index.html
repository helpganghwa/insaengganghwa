<!doctype html>
<html lang="ko">
  <head>

    <title>인생강화</title>
    <style>
      html, body { margin: 0; height: 100%; background: #151518; color: #e4e4e7; font-family: -apple-system, system-ui, sans-serif; }
      main { display: flex; height: 100%; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; }
      button { border: 0; border-radius: 12px; background: #f59e0b; color: #1c1917; font-weight: 700; padding: 12px 20px; font-size: 15px; }
    </style>

  <body>
    <!-- server.url 로드 실패(오프라인 등) 시에만 보이는 안내 — 정상 경로는 ganghwa.app을 바로 연다. -->
    <main>
      <p>인터넷 연결을 확인한 뒤 다시 시도해 주세요.</p>
      <button type="button" onclick="location.href='https://ganghwa.app/?src=ios'">다시 시도</button>
    </main>
